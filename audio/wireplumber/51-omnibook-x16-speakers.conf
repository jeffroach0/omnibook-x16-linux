# HP OmniBook X 16 (DT boot): only two speakers, on PCM slots 0 (left) and 2 (right).
# Slots 1 and 3 belonged to the GLYMUR-CRD rear amps that this laptop does not have.
monitor.alsa.rules = [
  {
    matches = [ { node.name = "alsa_output.platform-sound.HiFi__Speaker__sink" } ]
    actions = { update-props = { audio.position = [ FL, RL, FR, RR ] } }
  }
]
