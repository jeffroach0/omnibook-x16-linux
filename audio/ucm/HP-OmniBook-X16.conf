# HP OmniBook X Laptop 16 (Mahua, DT boot). Local file, not from alsa-ucm-conf.
# Like GLYMUR-CRD.conf, but two WSA884x speakers on WSA (swr0) only.

SectionUseCase."HiFi" {
	File "/Qualcomm/glymur/HP-OmniBook-X16-HiFi.conf"
	Comment "HiFi quality Music."
}

Include.card-init.File "/lib/card-init.conf"
Include.ctl-remap.File "/lib/ctl-remap.conf"
Include.wsa-init.File "/codecs/wsa884x/two-speakers/init.conf"

BootSequence [
	cset "name='WSA WSA_RX0 Digital Volume' 84"
	cset "name='WSA WSA_RX1 Digital Volume' 84"
	cset "name='WSA WSA_COMP1 Switch' 0"
	cset "name='WSA WSA_COMP2 Switch' 0"
]
