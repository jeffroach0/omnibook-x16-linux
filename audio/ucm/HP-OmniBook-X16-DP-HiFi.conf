# HP OmniBook X Laptop 16: HiFi for the X1E CRD/DEVKIT topology (DisplayPort audio).
# PCMs: hw:1 = MultiMedia2 -> WSA speakers (4 ch), hw:3 = MultiMedia4 <- VA mics,
# hw:4 = MultiMedia5 -> DISPLAY_PORT_RX_0 (back USB-C), hw:5 = MultiMedia6 -> DISPLAY_PORT_RX_1 (front USB-C).

SectionVerb {
	EnableSequence [
		cset "name='WSA_CODEC_DMA_RX_0 Audio Mixer MultiMedia2' 1"
		cset "name='MultiMedia4 Mixer VA_CODEC_DMA_TX_0' 1"
		# DP routes stay ON: PipeWire probes every PCM with only the verb active, and an
		# unrouted DP PCM fails to open (-EINVAL), which makes it reject the whole HiFi profile.
		cset "name='DISPLAY_PORT_RX_0 Audio Mixer MultiMedia5' 1"
		cset "name='DISPLAY_PORT_RX_1 Audio Mixer MultiMedia6' 1"
	]

	Include.wsae.File "/codecs/wsa884x/two-speakers/DefaultEnableSeq.conf"
	Include.wsm1e.File "/codecs/qcom-lpass/wsa-macro/Wsa1SpeakerEnableSeq.conf"

	Value {
		TQ "HiFi"
	}
}

SectionDevice."Speaker" {
	Comment "Speaker playback"

	Include.wsmspk1e.File "/codecs/qcom-lpass/wsa-macro/Wsa1SpeakerEnableSeq.conf"
	Include.wsmspk1d.File "/codecs/qcom-lpass/wsa-macro/Wsa1SpeakerDisableSeq.conf"
	Include.wsaspk.File "/codecs/wsa884x/two-speakers/SpeakerSeq.conf"

	Value {
		PlaybackChannels 4
		PlaybackPriority 100
		PlaybackPCM "hw:${CardId},1"
		PlaybackMixer "default:${CardId}"
		PlaybackMixerElem "Speakers"
	}
}

SectionDevice."Mic" {
	Comment "Internal microphones"

	# DMIC0/DMIC1EnableSeq.conf inlined, with VA_DEC volume 118 (+34 dB) instead of 100 (+16 dB).
	# 112 was enough with the GLYMUR topology; with this one speech came out ~6 dB lower (measured Oct 24).
	EnableSequence [
		cset "name='VA DEC0 MUX' VA_DMIC"
		cset "name='VA DMIC MUX0' DMIC0"
		cset "name='VA_AIF1_CAP Mixer DEC0' 1"
		cset "name='VA_DEC0 Volume' 118"
		cset "name='VA DEC1 MUX' VA_DMIC"
		cset "name='VA DMIC MUX1' DMIC1"
		cset "name='VA_AIF1_CAP Mixer DEC1' 1"
		cset "name='VA_DEC1 Volume' 118"
	]
	Include.vadm0d.File "/codecs/qcom-lpass/va-macro/DMIC0DisableSeq.conf"
	Include.vadm1d.File "/codecs/qcom-lpass/va-macro/DMIC1DisableSeq.conf"

	# This topology's MultiMedia4 only starts with 4 channels (2 ch: snd_pcm_start -EINVAL).
	# DMIC0/DMIC1 arrive on slots 0/1; slots 2/3 are silent.
	Value {
		CaptureChannels 4
		CapturePriority 100
		CapturePCM "hw:${CardId},3"
	}
}

SectionDevice."HDMI0" {
	Comment "USB-C DisplayPort (back port)"

	Value {
		PlaybackPriority 200
		PlaybackPCM "hw:${CardId},4"
		JackControl "DP0 Jack"
	}
}

SectionDevice."HDMI1" {
	Comment "USB-C DisplayPort (front port)"

	Value {
		PlaybackPriority 200
		PlaybackPCM "hw:${CardId},5"
		JackControl "DP1 Jack"
	}
}
