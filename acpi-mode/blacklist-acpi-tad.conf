# OmniBook X 16 (ACPI mode): the ACPI time device \_SB.PRTC can't work in Linux
# (its methods need a GenericSerialBus handler that doesn't exist), so every clock
# read/write fails and floods the log with ~100 "ACPI Error" lines per second.
# Stop the acpi_tad driver from loading. Delete this file to undo.
blacklist acpi_tad
